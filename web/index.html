<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>tradeterm — PAPER</title>
<style>body{font:13px system-ui;background:#0d1117;color:#c9d1d9;margin:16px}h1{font-size:20px}h3{margin:18px 0 6px}.b{color:#f85149;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}.c{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px}
.c h4{margin:0 0 4px;font-size:14px}.k{display:flex;justify-content:space-between}.m{color:#8b949e;font-size:11px}
table{border-collapse:collapse;width:100%;font-size:11px}td,th{border-bottom:1px solid #30363d;padding:3px;text-align:left;vertical-align:top}.pos{color:#3fb950}.neg{color:#f85149}
pre{white-space:pre-wrap;font-size:11px}details{margin:4px 0}summary{cursor:pointer;color:#58a6ff}</style></head>
<body><h1>tradeterm <span class="b">PAPER TRADING ONLY — no real money</span></h1><div id="gen" class="m"></div>
<h3>Accounts (each started at $20)</h3><div class="grid" id="cards"></div>
<h3>Equity curves (live paper)</h3><canvas id="eq" width="1200" height="260" style="width:100%;background:#161b22"></canvas><div id="leg" class="m"></div>
<h3>Backtest + walk-forward (out-of-sample), 45 days</h3><table id="bt"></table><div class="m" id="btn"></div>
<h3>Per-account detail</h3><div id="det"></div><h3>Rules &amp; fee sources</h3><details><summary>show full rules JSON</summary><pre id="rules"></pre></details>
<script>
const f=(x,d=3)=>x==null?'–':(+x).toFixed(d),t=s=>new Date(s*1000).toLocaleString(),cl=x=>x>0?'pos':x<0?'neg':'';
const COL=['#58a6ff','#f78166','#3fb950','#d2a8ff','#ffa657','#79c0ff','#ff7b72','#a5d6ff','#e3b341'];
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{gen.textContent='Snapshot '+t(d.generated)+' · slippage '+d.slippage_pct+'% · risk '+JSON.stringify(d.risk);
cards.innerHTML=d.accounts.map((a,i)=>{const s=a.stats;return `<div class=c style="border-left:4px solid ${COL[i%9]}"><h4>${a.id}</h4><div class=m>${a.strategy} · ${a.gran/60}m · ${a.fees} (maker ${a.fee_profile.maker_pct}% / taker ${a.fee_profile.taker_pct}%) · ${a.entry}/${a.exit} · round-trip ≈${a.round_trip_cost_pct}% ${a.fee_profile.attainable_at_20usd?'':'· <b>tier NOT attainable at $20</b>'}</div>
<div class=k><span>Equity</span><b class=${cl(a.equity-20)}>$${f(a.equity,4)}</b></div><div class=k><span>Cash</span><span>$${f(a.cash,4)}</span></div>
<div class=k><span>Closed / win%</span><span>${s.closed} / ${s.win_rate==null?'–':s.win_rate+'%'}</span></div><div class=k><span>Fees paid</span><span>$${f(s.fees,4)}</span></div>
<div class=k><span>Gross / Net P&L</span><span class=${cl(s.net)}>$${f(s.gross,4)} / $${f(s.net,4)}</span></div><div class=k><span>Open / pending</span><span>${a.positions.length} / ${a.pending.length}</span></div></div>`}).join('');
const c=eq.getContext('2d'),W=eq.width,H=eq.height;let all=d.accounts.flatMap(a=>a.curve),ts=all.map(x=>x[0]),vs=all.map(x=>x[1]);
if(all.length){const t0=Math.min(...ts),t1=Math.max(...ts)+1,mn=Math.min(...vs,20)-.02,mx=Math.max(...vs,20)+.02,X=q=>(q-t0)/(t1-t0)*W,Y=q=>H-(q-mn)/(mx-mn)*(H-20)-10;
c.strokeStyle='#444';c.beginPath();c.moveTo(0,Y(20));c.lineTo(W,Y(20));c.stroke();d.accounts.forEach((a,i)=>{c.strokeStyle=COL[i%9];c.beginPath();a.curve.forEach((p,j)=>c[j?'lineTo':'moveTo'](X(p[0]),Y(p[1])));c.stroke()});
c.fillStyle='#8b949e';c.fillText('$'+f(mx),4,12);c.fillText('$'+f(mn),4,H-4)}
leg.innerHTML=d.accounts.map((a,i)=>`<span style="color:${COL[i%9]}">■ ${a.id}</span>`).join(' &nbsp; ');
const R=d.research;if(R){bt.innerHTML='<tr><th>Account</th><th>RT cost</th><th colspan=5>Full 45d, fixed rules: trades · win% · gross · fees · net</th><th>max DD</th><th colspan=4>Walk-forward OOS: trades · gross · fees · net</th></tr>'+Object.entries(R.accounts).map(([k,v])=>{const a=v.full_fixed_params,o=v.walk_forward_oos;return `<tr><td>${k}</td><td>${v.round_trip_cost_pct}%</td><td>${a.trades}</td><td>${a.win_rate??'–'}</td><td class=${cl(a.gross)}>${f(a.gross)}</td><td>${f(a.fees)}</td><td class=${cl(a.net)}><b>${f(a.net)}</b></td><td>${a.max_dd_pct}%</td><td>${o.trades}</td><td class=${cl(o.gross)}>${f(o.gross)}</td><td>${f(o.fees)}</td><td class=${cl(o.net)}><b>${f(o.net)}</b></td></tr>`}).join('');
btn.textContent='USD on a $20 account. Generated '+t(R.generated)+'. Walk-forward: 21-day train picks TP/SL (or SL/RSI) from a 9- or 6-point grid by train net P&L only; then the next untouched 7-day window is tested. OOS = sum of test windows (each restarts at $20). Spread assumed '+R.spread_assumed_pct+'% + slippage on taker fills; maker fills require price to trade through the limit.'}
det.innerHTML=d.accounts.map(a=>`<details><summary>${a.id} — trades (${a.trades.length}), positions, latest decisions</summary>
<table><tr><th>Time</th><th>Pair</th><th>Side</th><th>Price</th><th>USD</th><th>Fee</th><th>Net</th><th>Reason</th></tr>${a.trades.map(x=>`<tr><td>${t(x.ts)}</td><td>${x.pair}</td><td>${x.side}</td><td>${f(x.px,6)}</td><td>${f(x.usd,4)}</td><td>${f(x.fee,4)}</td><td class=${cl(x.net)}>${x.net==null?'':f(x.net,4)}</td><td>${x.reason}</td></tr>`).join('')}</table>
<table>${a.positions.map(p=>`<tr><td>OPEN ${p.pair}</td><td>entry ${f(p.px,6)}</td><td>target ${f(p.tp,6)}</td><td>SL ${f(p.sl,6)}</td><td>mark ${f(p.mark,6)}</td></tr>`).join('')}${a.pending.map(p=>`<tr><td>PENDING ${p.pair}</td><td>limit ${f(p.limit_px,6)}</td><td>$${f(p.usd,4)}</td><td colspan=2>${p.reason}</td></tr>`).join('')}</table>
<table>${a.decisions.map(x=>`<tr><td>${t(x.ts)}</td><td>${x.pair}</td><td>${x.action}</td><td>${x.reason}</td></tr>`).join('')}</table></details>`).join('');
rules.textContent=JSON.stringify({accounts:d.accounts.map(a=>({id:a.id,strategy:a.strategy,gran_sec:a.gran,fees:a.fees,entry:a.entry,exit:a.exit,params:a.params})),risk:d.risk,fee_sources:d.fee_sources},null,1)})</script></body></html>
